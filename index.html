<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#7A1F33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Otoqi Slot">
  <title>Prenota i tuoi slot - Otoqi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    window.addEventListener("error", function (e) {
      document.getElementById("app").innerHTML =
        '<div style="padding:20px;margin:20px;background:#fff;border:1px solid #7A1F33;border-radius:14px;color:#7A1F33;font-family:sans-serif">' +
        '<b>Errore JS:</b> ' + e.message + '<br><small>' + (e.filename || '') + ' (riga ' + e.lineno + ')</small></div>';
    });
  </script>
</head>
<body>
  <div id="app"><div class="spin"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
